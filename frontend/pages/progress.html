<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MandarinBridge | Progress</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* Ensure loading overlay works properly */
    .page-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #fffaf2 0%, #ffe4d6 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10000;
    }
    .page-loading.hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }
</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">MandarinBridge</a>
    <nav class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/reports">Reports</a>
      <a href="/quiz">Quiz</a>
      <a href="/chatbot">Chatbot</a>
    </nav>
  </header>
  <main class="page">
    <h1 class="page-title">Progress</h1>
    <p class="lead">Students can track lesson completion, quiz results, and practice activity.</p>
    <section class="grid">
      <div class="card"><h2>Vocabulary</h2><div class="progress-bar"><span style="width: 65%"></span></div><p>65% complete</p></div>
      <div class="card"><h2>Grammar</h2><div class="progress-bar"><span style="width: 40%"></span></div><p>40% complete</p></div>
      <div class="card"><h2>Pronunciation</h2><div class="progress-bar"><span style="width: 50%"></span></div><p>50% complete</p></div>
    </section>
    <div class="button-row"><a class="button" href="/reports">View Reports</a></div>
  </main>
  <footer class="site-footer"><p>&copy; 2026 MandarinBridge.</p></footer>
  <script src="../js/main.js"></script>
  <script src="../js/page-loader.js"></script>
</body>
</html>
