<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MandarinBridge | Contact Us</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* Ensure loading overlay works properly */
    .page-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #fffaf2 0%, #ffe4d6 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10000;
    }
    .page-loading.hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }
</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">MandarinBridge</a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/support">Support</a>
      <a href="/faqs">FAQs</a>
      <a href="/about">About</a>
    </nav>
  </header>
  <main class="page">
    <h1 class="page-title">Contact Us</h1>
    <p class="lead">Students can use this page to send questions or report issues.</p>
    <form class="form card">
      <label>Name
        <input type="text" placeholder="Your name">
      </label>
      <label>Email
        <input type="email" placeholder="student@example.com">
      </label>
      <label>Message
        <textarea rows="5" placeholder="How can we help?"></textarea>
      </label>
      <button class="button" type="button">Submit Message</button>
    </form>
  </main>
  <footer class="site-footer"><p>&copy; 2026 MandarinBridge.</p></footer>
  <script src="../js/main.js"></script>
  <script src="../js/page-loader.js"></script>
</body>
</html>
