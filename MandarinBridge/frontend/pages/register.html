<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MandarinBridge | Register</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* Ensure loading overlay works properly */
    .page-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #fffaf2 0%, #ffe4d6 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10000;
    }
    .page-loading.hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }
</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">MandarinBridge</a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/login">Login</a>
      <a href="/register">Register</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/about">About</a>
      <a href="/support">Support</a>
    </nav>
  </header>

  <main class="page">
    <h1 class="page-title">Create Your Account</h1>
    <p class="lead">Join MandarinBridge to track your level, save progress, and access structured lessons.</p>
    <form id="register-form" class="form card">
      <div id="register-server-error" class="server-error" hidden></div>
      <label>Full Name
        <input id="register-name" name="full_name" type="text" required maxlength="120" placeholder="Your name" autocomplete="name">
      </label>
      <label>Email
        <input id="register-email" name="email" type="email" required maxlength="120" placeholder="student@example.com" autocomplete="email">
      </label>
      <label>Create Password
        <input
          id="register-password"
          name="password"
          type="password"
          required
          minlength="8"
          maxlength="128"
          pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
          title="At least 8 characters with one letter and one number"
          autocomplete="new-password"
          placeholder="Create password">
      </label>
      <label>Mandarin Level
        <select id="register-level" name="mandarin_level" required>
          <option value="Beginner">Beginner</option>
          <option value="Elementary">Elementary</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </label>
      <button class="button" type="submit">Create Account</button>
      <p class="lead" style="margin-top: 16px;">Already registered? <a href="/login">Login</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 MandarinBridge.</p>
  </footer>
  <script src="../js/main.js"></script>
  <script src="../js/auth-forms.js"></script>
  <script src="../js/page-loader.js"></script>
</body>
</html>
