<!-- quiz.html -->

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    MandarinBridge | Dialogue Practice
  </title>

  <link
    rel="stylesheet"
    href="../css/styles.css"
  />

  <style>

    body {

      background: #f7f3ed;
    }

    /* =========================
       PAGE
    ========================== */

    .page {

      max-width: 1000px;

      margin: auto;

      padding: 40px 24px;
    }

    .page-title {

      font-size: 72px;

      font-weight: 800;

      line-height: 1.05;

      margin-bottom: 20px;

      color: #1d2736;
    }

    .lead {

      font-size: 20px;

      color: #5f6f86;

      margin-bottom: 32px;
    }

    /* =========================
       SEARCH + FILTER
    ========================== */

    .quiz-controls {

      display: flex;

      gap: 16px;

      flex-wrap: wrap;

      margin-bottom: 36px;
    }

    .quiz-controls input,
    .quiz-controls select {

      padding: 14px 18px;

      border-radius: 14px;

      border: 1px solid #d7d7d7;

      background: white;

      font-size: 16px;

      min-width: 240px;

      outline: none;

      transition: 0.2s;
    }

    .quiz-controls input:focus,
    .quiz-controls select:focus {

      border-color: #e24b2d;

      box-shadow:
        0 0 0 4px rgba(226,75,45,0.12);
    }

    /* =========================
       QUIZ CARD
    ========================== */

    .quiz-card {

      background: white;

      padding: 40px;

      border-radius: 28px;

      box-shadow:
        0 8px 24px rgba(0,0,0,0.06);

      overflow: hidden;
    }

    .question-counter {

      font-size: 18px;

      color: #6d7a8d;

      margin-bottom: 28px;

      font-weight: 600;
    }

    /* =========================
       SCENARIO BOX
    ========================== */

    .scenario {

      background:
        linear-gradient(
          135deg,
          #fff5f1,
          #fff
        );

      border:
        2px solid #ffe1d8;

      padding: 28px;

      border-radius: 22px;

      margin-bottom: 30px;
    }

    .scenario p {

      font-size: 32px;

      font-weight: 700;

      color: #1f2937;

      margin-bottom: 12px;
    }

    .scenario em {

      font-size: 17px;

      color: #6b7280;
    }

    /* =========================
       CHOICES
    ========================== */

    .choices {

      display: flex;

      flex-direction: column;

      gap: 16px;
    }

    .choice-btn {

      width: 100%;

      padding: 18px;

      border: none;

      border-radius: 18px;

      background: #f5f5f5;

      color: #1f2937;

      font-size: 17px;

      font-weight: 600;

      text-align: left;

      cursor: pointer;

      transition: all 0.2s ease;
    }

    .choice-btn:hover {

      transform: translateY(-2px);

      background: #e24b2d;

      color: white;
    }

    .choice-btn:disabled {

      cursor: not-allowed;
    }

    /* =========================
       FEEDBACK
    ========================== */

    .feedback {

      margin-top: 24px;

      font-size: 22px;

      font-weight: 700;
    }

    /* =========================
       BUTTONS
    ========================== */

    .next-btn,
    .retry-btn {

      margin-top: 28px;

      padding: 16px 28px;

      border: none;

      border-radius: 16px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }

    .next-btn {

      background:
        linear-gradient(
          135deg,
          #ff7849,
          #e24b2d
        );

      color: white;

      box-shadow:
        0 6px 18px rgba(226,75,45,0.3);

      display: none;
    }

    .next-btn:hover {

      transform: translateY(-2px);

      opacity: 0.95;
    }

    .retry-btn {

      background: #1f2937;

      color: white;
    }

    .retry-btn:hover {

      background: #111827;
    }

    /* =========================
       FINAL SCORE
    ========================== */

    .final-score {

      display: none;

      margin-top: 30px;

      background: white;

      padding: 50px;

      border-radius: 28px;

      text-align: center;

      box-shadow:
        0 8px 24px rgba(0,0,0,0.06);
    }

    .final-score h2 {

      font-size: 48px;

      margin-bottom: 16px;

      color: #1f2937;
    }

    .final-score p {

      font-size: 24px;

      color: #5f6f86;

      margin-bottom: 16px;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 768px) {

      .page-title {

        font-size: 52px;
      }

      .scenario p {

        font-size: 24px;
      }

      .quiz-card {

        padding: 26px;
      }

    }
    
    .page-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #fffaf2 0%, #ffe4d6 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10000;
    }
    .page-loading.hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

  </style>

</head>

<body>

  <!-- ======================
       HEADER
  ======================= -->

  <header class="site-header">

    <a
      class="brand"
      href="/"
    >
      MandarinBridge
    </a>

    <nav class="nav-links">

      <a href="/dashboard">
        Dashboard
      </a>

      <a href="/modules">
        Lessons
      </a>

      <a href="/progress">
        Progress
      </a>

      <a href="/reports">
        Reports
      </a>

    </nav>

  </header>

  <!-- ======================
       MAIN CONTENT
  ======================= -->

  <main class="page">

    <h1 class="page-title">
      Scenario Dialogue Practice
    </h1>

    <p class="lead">
      Practice real-life Mandarin conversations
      through interactive dialogue scenarios.
    </p>

    <!-- SEARCH + FILTER -->

    <div class="quiz-controls">

      <input
        type="text"
        id="search-input"
        placeholder="Search dialogue..."
      />

      <select id="filter-select">

        <option value="all">
          All Categories
        </option>

        <option value="shopping">
          Shopping
        </option>

        <option value="school">
          School
        </option>

        <option value="greetings">
          Greetings
        </option>

      </select>

    </div>

    <!-- QUIZ CARD -->

    <section
      class="quiz-card"
      id="quiz-card"
    >

      <div
        class="question-counter"
        id="question-counter"
      >
        Question 1 / 15
      </div>

      <div class="scenario">

        <p id="question-text"></p>

        <em id="translation-text"></em>

      </div>

      <div
        class="choices"
        id="choices-container"
      ></div>

      <div
        class="feedback"
        id="feedback"
      ></div>

      <button
        class="next-btn"
        id="next-btn"
      >
        Next Question →
      </button>

    </section>

    <!-- FINAL SCORE -->

    <section
      class="final-score"
      id="final-score"
    ></section>

  </main>

  <!-- ======================
       FOOTER
  ======================= -->

  <footer class="site-footer">

    <p>
      &copy; 2026 MandarinBridge.
    </p>

  </footer>

  <!-- ======================
       SCRIPT
  ======================= -->

  <script src="../js/quiz.js"></script>
  <script src="../js/page-loader.js"></script>
</body>
</html>
